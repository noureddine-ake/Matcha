# version: "3.9"

services:
  # ====================
  # PostgreSQL Database
  # ====================
  postgres:
    image: postgres:16
    container_name: matcha-postgres-prod
    env_file: .env
    ports:
      - "5431:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d
    networks:
      - app-network

  # ====================
  # Redis Cache
  # ====================
  redis:
    image: redis:7
    container_name: redis-prod
    restart: always
    env_file:
      - .env
    volumes:
      - redis_data_prod:/data
    networks:
      - app-network
    ports:
      - "6380:6379"

  # ====================
  # Backend (Express)
  # ====================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: backend-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network

  # ====================
  # Frontend (Next.js)
  # ====================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: frontend-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    # NO VOLUMES MAPPED TO SOURCE CODE IN PROD
    networks:
      - app-network

# ====================
# Networks & Volumes
# ====================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_data:
