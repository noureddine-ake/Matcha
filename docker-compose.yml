# version: "3.9"

services:
  # ====================
  # PostgreSQL Database
  # ====================
  postgres:
    image: postgres:16
    container_name: matcha-postgres
    env_file: .env
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d

    networks:
      - app-network

  # ====================
  # Redis Cache
  # ====================
  redis:
    image: redis:7
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    ports:
      - "6380:6379"

  # ====================
  # Backend (Express)
  # ====================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    networks:
      - app-network

  # ====================
  # Frontend (Next.js)
  # ====================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app-network

# ====================
# Networks & Volumes
# ====================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
